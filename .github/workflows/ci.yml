name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a supported target for the CLI (filename rules, path length,
        # browser launch), so it is exercised on every run rather than nightly.
        os: [ubuntu-latest, windows-latest]
        node: [20] # the minimum declared in engines
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # The end-to-end suite runs the built CLI, so the build comes first.
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  package:
    name: Verify published package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack
        run: |
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack

      # Installing the tarball into an empty project is the only way to catch a
      # missing file or a stray runtime dependency before it reaches the registry.
      - name: Install the tarball into a clean project
        run: |
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          echo '{"name":"consumer","version":"1.0.0","private":true}' > package.json
          npm install /tmp/pack/*.tgz

      - name: Assert the package has no runtime dependencies
        run: |
          cd /tmp/consumer
          node -e '
            const fs = require("fs");
            const installed = fs.readdirSync("node_modules").filter((name) => !name.startsWith("."));
            console.log("installed:", installed.join(", ") || "(none)");
            const unexpected = installed.filter((name) => name !== "@infodb");
            if (unexpected.length > 0) {
              console.error("unexpected transitive dependencies:", unexpected.join(", "));
              process.exit(1);
            }
          '

      - name: Run the installed CLI
        run: |
          cd /tmp/consumer
          ./node_modules/.bin/skimalens --help
          printf '[{"uuid":"a","name":"CI","created_at":"2025-01-01T00:00:00Z","updated_at":"2025-01-01T00:00:00Z","chat_messages":[{"uuid":"m","text":"hi","sender":"human","created_at":"2025-01-01T00:00:00Z","updated_at":"2025-01-01T00:00:00Z"}]}]' > conversations.json
          ./node_modules/.bin/skimalens --export ./out conversations.json
          test -f ./out/CI.md
